name: rdp-dev

services:
  postgres:
    # TimescaleDB HA image: PostgreSQL 16 + TimescaleDB + PostGIS + pgvector all included.
    # Confirmed in 00_HUMAN_SETUP_INSTRUCTIONS.md: this is the only image we need.
    image: timescale/timescaledb-ha:pg16
    container_name: rdp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rdp
      POSTGRES_PASSWORD: rdp_dev_password
      POSTGRES_DB: rdp_dev
      # TimescaleDB tuning for local dev
      TS_TUNE_MEMORY: 2GB
      TS_TUNE_NUM_CPUS: 2
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rdp -d rdp_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rdp-net

  redis:
    image: redis:7-alpine
    container_name: rdp-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '512mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rdp-net

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: rdp-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: dev_master_key_change_in_production
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rdp-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local

networks:
  rdp-net:
    driver: bridge
